version: 1
pillar: research-transport-mobility
title: "Transport & mobility"
streaming_preferred: true

huggingface:
  - repo_id: nyu-mml/glue
    config: cola
    split: train[:2%]
    streaming: true
    note: Tiny GLUE stream for CI / dataloader sanity — replace with domain datasets as charters land.
  - repo_id: fancyzhx/ag_news
    split: train[:1%]
    streaming: true
    note: CI/news stream proxy for `CHARTER_MOBILITY_NEWS_PROXY_STREAM_SMOKE` + pytest (not mobility ground truth); replace when on-charter OD, transit, or network tables pin.

kaggle: []


search_keywords: []

reference_streams:
  - name: OpenStreetMap (reference)
    url: https://www.openstreetmap.org
    note: Graph / routing priors; respect tile usage policy and regional extracts.
  - name: Domain-native pins (next)
    url: https://gtfs.org/
    note: Next on-charter pins should target licensed GTFS or other static route graphs, probe counts, or similar mobility tables—add real Hub/API identifiers only when a charter commits; do not invent repo_id placeholders.

